<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanks - Martin Nzau (Monsiu)</title>
  <meta name="description" content="Thanks for your request. Martin Nzau will reply within 24 hours." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/profile.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0C0C0C;
      --bg-card: #141414;
      --text: #F2F2F2;
      --muted: #A8A8A8;
      --accent: #4F8EF7;
      --border: #222222;
    }

    [data-theme="light"] {
      --bg: #F5F5F5;
      --bg-card: #FFFFFF;
      --text: #111111;
      --muted: #555555;
      --accent: #2563EB;
      --border: #DEDEDE;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 400;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      max-width: 540px;
      width: 100%;
      text-align: center;
    }

    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.5rem;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    p {
      color: var(--muted);
      line-height: 1.8;
      margin-bottom: 2rem;
    }

    .actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }

    .btn {
      display: inline-block;
      padding: 0.9rem 2.2rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #6BA3FF; }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--muted); color: var(--text); }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">// Request received</p>
    <h1>Thanks!</h1>
    <p>
      Your service request has been sent successfully. I will get back to you over email
      with next steps, usually within 24-48 hours.
    </p>
    <p style="font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 2rem;">
      In the meantime, feel free to
      <a href="https://www.upwork.com/freelancers/~01d848dcebdf54f162" target="_blank" rel="noopener noreferrer" style="color: var(--accent);">check my Upwork reviews ↗</a>
    </p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Back to Home</a>
      <a href="/services/" class="btn btn-ghost">Submit Another</a>
    </div>
  </div>

  <script>
    const saved = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
  </script>
</body>
</html>
