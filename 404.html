<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VJZYEZ8XEN"></script>
  <script>

    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      analytics_storage: 'denied',
      wait_for_update: 500
    });
    gtag('js', new Date());
    gtag('config', 'G-VJZYEZ8XEN');

  <script defer src="/consent.js"></script>
  <title>404 - Page Not Found - Martin Nzau (Monsiu)</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/profile.png" />
  <link rel="apple-touch-icon" href="/profile.png" />
  <meta name="theme-color" content="#0C0C0C" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0C0C0C;
      --bg-card: #141414;
      --text: #F2F2F2;
      --muted: #A8A8A8;
      --accent: #4F8EF7;
      --border: #222222;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .wrap {
      max-width: 520px;
    }

    .code {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--accent);
      font-size: 14px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(56px, 12vw, 96px);
      line-height: 1;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    h1 span { color: var(--accent); }

    p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a.btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: 500;
      text-decoration: none;
      font-size: 15px;
      transition: transform 0.15s, background 0.15s, border-color 0.15s;
    }

    a.btn:hover { transform: translateY(-1px); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-ghost {
      border: 1px solid var(--border);
      color: var(--text);
      background: transparent;
    }

    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="code">Error 404</div>
    <h1>Lost in <span>the void.</span></h1>
    <p>The page you're looking for doesn't exist, was moved, or never made it to production.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Back to Home</a>
      <a href="/services/" class="btn btn-ghost">See Services</a>
    </div>
  </main>
</body>
</html>
