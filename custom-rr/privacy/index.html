  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0C0C0C;
      --bg-card: #141414;
      --text: #EFEFEF;
      --muted: #999999;
      --accent: #4F8EF7;
      --border: #222222;
      --max: 860px;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F5F5F5;
        --bg-card: #FFFFFF;
        --text: #111111;
        --muted: #555555;
        --accent: #2563EB;
        --border: #DEDEDE;
      }
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 300;
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-underline-offset: 0.2em; }
    a:hover { filter: brightness(1.1); }

    main {
      max-width: var(--max);
      margin: 0 auto;
      padding: 4rem 1.5rem 6rem;
    }

    .back {
      display: inline-block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: none;
      margin-bottom: 2rem;
    }
    .back:hover { color: var(--accent); }

    #content h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: clamp(2rem, 5vw, 2.6rem);
      letter-spacing: -0.01em;
      margin-bottom: 0.75rem;
    }
    #content h2 {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 1.25rem;
      letter-spacing: 0.02em;
      margin: 2.5rem 0 0.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }
    #content h2:first-of-type { border-top: none; padding-top: 0; }
    #content h3 {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 1.05rem;
      margin: 1.5rem 0 0.5rem;
    }

    #content p { margin: 0.75rem 0; }
    #content ul, #content ol { margin: 0.5rem 0 0.5rem 1.25rem; }
    #content li { margin: 0.35rem 0; }
    #content strong { font-weight: 500; }
    #content em { color: var(--muted); }

    #content code {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.88em;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.05em 0.4em;
    }
    #content pre {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      overflow-x: auto;
      margin: 1rem 0;
    }
    #content pre code {
      border: none;
      background: transparent;
      padding: 0;
    }

    #content blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.25rem 0 0.25rem 1rem;
      margin: 1rem 0;
      color: var(--muted);
    }

    #content table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin: 1rem 0;
      display: block;
      overflow-x: auto;
    }
    #content th, #content td {
      text-align: left;
      vertical-align: top;
      padding: 0.7rem 0.9rem;
      border-bottom: 1px solid var(--border);
    }
    #content tr:last-child td { border-bottom: none; }
    #content th {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
    }

    #content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    .meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
      margin: -0.5rem 0 2rem;
    }

    .status {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85rem;
      color: var(--muted);
      padding: 2rem 0;
      text-align: center;
    }
    .status.error { color: #E5484D; }
    .status.error a { color: var(--accent); }

    footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>

<body>
  <main>
    <a class="back" href="/">&larr; back to monsiu.github.io</a>

    <p class="meta" id="source-meta">Loading latest version from GitHub...</p>

    <article id="content">
      <div class="status" id="status">Loading...</div>
    </article>

    <footer>
      &copy; Monsiu Tech Solutions. Live mirror of
      <a href="https://github.com/monsiu/Custom-RR/blob/main/PRIVACY.md">PRIVACY.md</a>.
      <br /><a href="/custom-rr/">Custom RR</a> · <a href="/custom-rr/beta/">Join the Play beta</a>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" crossorigin="anonymous"></script>
  <script>
    (function () {
      var SOURCE = 'https://raw.githubusercontent.com/monsiu/Custom-RR/main/PRIVACY.md';
      var contentEl = document.getElementById('content');
      var statusEl = document.getElementById('status');
      var metaEl = document.getElementById('source-meta');

      function showError(msg) {
        contentEl.innerHTML = '';
        var p = document.createElement('p');
        p.className = 'status error';
        p.innerHTML = msg + ' Read it directly on <a href="https://github.com/monsiu/Custom-RR/blob/main/PRIVACY.md">GitHub</a>.';
        contentEl.appendChild(p);
        metaEl.textContent = '';
      }

      if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') {
        showError('Could not load renderer.');
        return;
      }

      marked.setOptions({ gfm: true, breaks: false });

      fetch(SOURCE, { cache: 'no-cache' })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          var lastMod = res.headers.get('last-modified');
          if (lastMod) {
            try {
              var d = new Date(lastMod);
              metaEl.textContent = 'Last updated ' + d.toLocaleDateString(undefined, {
                year: 'numeric', month: 'long', day: 'numeric'
              }) + '.';
            } catch (e) {
              metaEl.textContent = '';
            }
          } else {
            metaEl.textContent = '';
          }
          return res.text();
        })
        .then(function (md) {
          var html = marked.parse(md);
          var clean = DOMPurify.sanitize(html, { ADD_ATTR: ['target'] });
          contentEl.innerHTML = clean;
          // Open any external links in a new tab for safety.
          contentEl.querySelectorAll('a[href^="http"]').forEach(function (a) {
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
          });
        })
        .catch(function (err) {
          showError('Could not load the privacy policy (' + err.message + ').');
        });
    })();
  </script>
</body>
</html>
